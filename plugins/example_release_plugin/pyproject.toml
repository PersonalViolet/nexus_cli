[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuscli-example-release-plugin"
version = "0.1.0"
description = "Example external plugin for nexuscli release workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "nexuscli contributors" }]
dependencies = [
    "nexuscli>=0.1.0",
    "typer>=0.12,<1.0"
]

[project.entry-points."nexuscli.command"]
example-release-hello = "example_release_plugin.plugin:HelloReleasePlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
