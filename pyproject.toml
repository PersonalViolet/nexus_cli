[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-open-cli"
version = "0.2.0"
description = "Extensible Typer CLI with hot-pluggable commands. NexusCLI loads built-in and third-party plugins on every invocation so you can add new commands by installing packages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "ByteKnight", email = "esqaNN@163.com" }
]
dependencies = [
    "typer[all]>=0.12,<1.0",
    "packaging>=24.0,<25",
    "platformdirs>=4.2,<5",
    "babel>=2.14,<3.0"
]

[project.urls]
# add project links here
"Homepage" = "https://github.com/PersonalViolet/nexus_cli"
"plugins" = "https://github.com/PersonalViolet/NexusOpenCLI-plugins-registry" 

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "black>=24.0,<25",
    "mypy>=1.10,<2"
]

[project.scripts]
ncli = "nexuscli.main:cli"

[project.entry-points."nexuscli.command"]
# third-party plugins should register into this group

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexuscli = ["locales/**"]
